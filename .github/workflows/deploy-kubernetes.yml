name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      chart_path:
        description: Path to the Helm chart inside the infrastructure repository.
        required: true
        type: string
      release_name:
        description: Helm release name.
        required: true
        type: string
      namespace:
        description: Kubernetes namespace to deploy into.
        required: true
        type: string
      environment:
        description: GitHub environment used for approval gates and secret scoping.
        required: false
        type: string
        default: production
      timeout:
        description: Helm upgrade and rollout timeout.
        required: false
        type: string
        default: 5m
    secrets:
      kubeconfig:
        description: Base64-encoded kubeconfig for the target cluster.
        required: true
      infra_token:
        description: Token with read access to the infrastructure repository.
        required: true
      registry_username:
        description: Registry username or token owner.
        required: true
      registry_password:
        description: Registry password or access token.
        required: true
      sops_age_key:
        description: Age private key used to decrypt SOPS-encrypted values files.
        required: false
      values_file_b64:
        description: Base64-encoded SOPS-encrypted Helm values file (same content as values.secret.yaml). Decoded, decrypted with sops and passed to helm upgrade with -f.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Kubernetes
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI templates
        uses: actions/checkout@v4
        with:
          repository: erivelto21/ci-templates
          ref: main
          path: .ci-templates

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.INFRA_REPO }}
          token: ${{ secrets.INFRA_TOKEN }}
          path: infra

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail

          if [ -z "$KUBECONFIG_B64" ]; then
            echo "error: kubeconfig secret is required."
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d >"$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Resolve image reference
        id: image-ref
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          .ci-templates/scripts/resolve-image-ref.sh

      - name: Create or update image pull secret
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_PULL_SECRET_NAME: ${{ vars.IMAGE_PULL_SECRET_NAME }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail

          if [ -z "$REGISTRY" ]; then
            echo "error: REGISTRY variable is required."
            exit 1
          fi
          if [ -z "$IMAGE_PULL_SECRET_NAME" ]; then
            echo "error: IMAGE_PULL_SECRET_NAME variable is required."
            exit 1
          fi

          # Namespace may not exist yet (helm --create-namespace runs later).
          # Create it idempotently so the imagePullSecret can be applied.
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry "$IMAGE_PULL_SECRET_NAME" \
            --docker-server="$REGISTRY" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Write values file
        id: values-file
        env:
          VALUES_FILE_B64: ${{ secrets.values_file_b64 }}
        run: |
          set -euo pipefail

          if [ -n "${VALUES_FILE_B64:-}" ]; then
            values_file="$RUNNER_TEMP/values.secret.yaml"
            echo "$VALUES_FILE_B64" | base64 -d >"$values_file" || {
              echo "error: values_file_b64 is not valid base64."
              exit 1
            }
            chmod 600 "$values_file"

            # SOPS-encrypted files start with an #ENC[...] header. Detect a
            # corrupt/malformed secret early instead of failing later in sops.
            if ! grep -q '^#ENC\[' "$values_file"; then
              size=$(wc -c <"$values_file")
              echo "error: decoded values file does not start with '#ENC[' (got ${size} bytes)."
              echo "       values_file_b64 must be the output of: base64 -w0 values.secret.yaml"
              echo "       stored as a single line, without wrapping, spacing or \\n literals."
              exit 1
            fi

            echo "file=$values_file" >>"$GITHUB_OUTPUT"
          fi

      - name: Install SOPS
        if: steps.values-file.outputs.file != ''
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sops" \
            https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x "$RUNNER_TEMP/sops"
          sudo mv "$RUNNER_TEMP/sops" /usr/local/bin/sops

      - name: Decrypt values file with SOPS
        id: decrypt-values
        if: steps.values-file.outputs.file != ''
        env:
          ENCRYPTED_VALUES_FILE: ${{ steps.values-file.outputs.file }}
          SOPS_AGE_KEY: ${{ secrets.sops_age_key }}
        run: |
          set -euo pipefail

          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "error: sops_age_key secret is required when values_file_b64 is set."
            exit 1
          fi

          decrypted="$RUNNER_TEMP/values.yaml"
          sops --decrypt "$ENCRYPTED_VALUES_FILE" >"$decrypted"
          chmod 600 "$decrypted"
          echo "file=$decrypted" >>"$GITHUB_OUTPUT"

      - name: Deploy with Helm
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ inputs.namespace }}
          CHART_PATH: ${{ inputs.chart_path }}
          REPOSITORY: ${{ steps.image-ref.outputs.repository }}
          TAG: ${{ steps.image-ref.outputs.tag }}
          TIMEOUT: ${{ inputs.timeout }}
          VALUES_FILE: ${{ steps.decrypt-values.outputs.file }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_NAME" ]; then
            echo "error: release_name input is required."
            exit 1
          fi
          if [ -z "$NAMESPACE" ]; then
            echo "error: namespace input is required."
            exit 1
          fi
          if [ -z "$CHART_PATH" ]; then
            echo "error: chart_path input is required."
            exit 1
          fi

          if [ -n "$VALUES_FILE" ]; then
            helm upgrade --install "$RELEASE_NAME" "./infra/$CHART_PATH" \
              --namespace "$NAMESPACE" \
              --create-namespace \
              --set "image.repository=$REPOSITORY" \
              --set "image.tag=$TAG" \
              -f "$VALUES_FILE" \
              --wait \
              --timeout "$TIMEOUT"
          else
            helm upgrade --install "$RELEASE_NAME" "./infra/$CHART_PATH" \
              --namespace "$NAMESPACE" \
              --create-namespace \
              --set "image.repository=$REPOSITORY" \
              --set "image.tag=$TAG" \
              --wait \
              --timeout "$TIMEOUT"
          fi

      - name: Verify rollout
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
          NAMESPACE: ${{ inputs.namespace }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          kubectl rollout status "deployment/$RELEASE_NAME" -n "$NAMESPACE" --timeout="$TIMEOUT"
