name: Publish image

on:
  workflow_call:
    inputs:
      dockerfile_path:
        description: Path to the Dockerfile.
        required: false
        type: string
        default: docker/Dockerfile.api
      build_context:
        description: Docker build context.
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish image
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve image reference
        id: image-ref
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          registry="${REGISTRY%/}"
          namespace="${NAMESPACE%/}"
          namespace="${namespace#/}"
          image_name="${IMAGE_NAME#/}"
          image_name="${image_name%/}"

          if [ -z "$registry" ]; then
            echo "registry input is required."
            exit 1
          fi

          if [ -z "$image_name" ]; then
            echo "image_name input is required."
            exit 1
          fi

          if [ -n "$namespace" ]; then
            image_ref="$registry/$namespace/$image_name:$SHA"
          else
            image_ref="$registry/$image_name:$SHA"
          fi

          echo "ref=$image_ref" >>"$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: true
          tags: ${{ steps.image-ref.outputs.ref }}
