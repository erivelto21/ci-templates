name: Publish image

on:
  workflow_call:
    inputs:
      build_context:
        description: Docker build context.
        required: false
        type: string
        default: .

env:
  DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH }}

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish image
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout CI templates
        uses: actions/checkout@v4
        with:
          repository: erivelto21/ci-templates
          ref: main
          path: .ci-templates

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve image reference
        id: image-ref
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          SHA: ${{ github.sha }}
          DOCKERFILE_PATH: ${{ env.DOCKERFILE_PATH }}
        run: |
          set -euo pipefail

          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "DOCKERFILE_PATH variable is required."
            exit 1
          fi

          .ci-templates/scripts/resolve-image-ref.sh

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build_context }}
          file: .ci-templates/${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.image-ref.outputs.ref }}
