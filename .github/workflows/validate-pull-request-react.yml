name: Validate React pull request

on:
  pull_request:
  workflow_call:

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Build application
        shell: bash
        run: npm run build

  format-check:
    name: Verify React formatting
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Verify formatting
        shell: bash
        run: npx prettier --check .

  lint:
    name: Run lint
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Run lint
        shell: bash
        run: npm run lint

  type-check:
    name: Run type check
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Run type check
        shell: bash
        run: npm run type-check

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Run tests
        shell: bash
        run: npm test -- --run

  test-coverage:
    name: Run coverage tests
    runs-on: ubuntu-latest
    needs:
      - install

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: npm install

      - name: Run coverage tests
        shell: bash
        run: npm run test:coverage
