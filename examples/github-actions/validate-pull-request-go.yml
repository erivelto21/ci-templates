name: Validate Go pull request

on:
  pull_request:

jobs:
  format-check:
    name: Verify Go formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install goimports
        shell: bash
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail

          gofmt_files="$(gofmt -l .)"
          if [ -n "$gofmt_files" ]; then
            echo "Files need gofmt:"
            printf '%s\n' "$gofmt_files"
            exit 1
          fi

          goimports_files="$(goimports -l .)"
          if [ -n "$goimports_files" ]; then
            echo "Files need goimports:"
            printf '%s\n' "$goimports_files"
            exit 1
          fi

  lint:
    name: Run lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Install golangci-lint
        shell: bash
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        shell: bash
        run: golangci-lint run ./...

  tidy:
    name: Verify dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Verify module tidy
        shell: bash
        run: |
          set -euo pipefail

          go mod tidy
          go mod verify

          if ! git diff --exit-code -- go.mod go.sum; then
            echo "Module files need tidying."
            exit 1
          fi

  build:
    name: Build application
    runs-on: ubuntu-latest
    needs:
      - format-check
      - lint
      - tidy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build application
        shell: bash
        run: go build ./...

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run tests
        shell: bash
        run: go test ./...

  test-race:
    name: Run race tests
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run race tests
        shell: bash
        run: go test -race ./...

  test-cover:
    name: Run coverage tests
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run coverage tests
        shell: bash
        run: go test -cover ./...
